{{- with resources.Get "js/main.js" }}
  {{- if eq hugo.Environment "development" }}
    {{- with . }}
      <script src="{{ .RelPermalink }}"></script>
    {{- end }}
  {{- else }}
    {{- with . }}
      <script src="{{ .RelPermalink }}" integrity="{{- .Data.Integrity }}" crossorigin="anonymous"></script>
    {{- end }}
  {{- end }}
{{- end }}

<script src="{{ site.Params.fontawesomekiturl }}" crossorigin="anonymous"></script>

<script>
  const toggleDarkMode = () => {
    const isDark = localStorage.getItem('darkMode') === 'true';
    document.documentElement.classList.toggle('dark', !isDark);
    localStorage.setItem('darkMode', !isDark);
  };

  document.addEventListener('DOMContentLoaded', () => {
    const isDark = localStorage.getItem('darkMode') === 'true';
    document.documentElement.classList.toggle('dark', isDark);
  });

  document.addEventListener('DOMContentLoaded', () => {
    const titles = document.querySelectorAll('.project-title');

    titles.forEach((title) => {
      const arrow = title.querySelector('.project-arrow');

      let details = title.nextElementSibling;
      while (details && !details.classList.contains('project-details')) {
        details = details.nextElementSibling;
      }

      if (details) {
        title.addEventListener('click', (e) => {
          if (e.target.closest('a')) {
            return;
          }

          details.classList.toggle('is-open');
          if (arrow) {
            arrow.classList.toggle('is-open');
          }
        });
      }
    });
  });
</script>
